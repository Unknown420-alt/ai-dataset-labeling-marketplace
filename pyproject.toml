[project]
name = "labeling-marketplace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn==0.32.0",
    "mangum==0.19.0",
    "pydantic==2.12.4",
    "pydantic-settings==2.6.1",
    "python-multipart==0.0.12",
    "email-validator==2.2.0",
    "SQLAlchemy==2.0.36",
    "greenlet==3.5.4",
    "asyncpg==0.30.0",
    "aiosqlite==0.20.0",
    "alembic==1.19.1",
    "python-jose[cryptography]==3.3.0",
    "bcrypt==4.0.1",
    "openai==1.58.1",
    "joblib==1.5.3",
    "httpx==0.28.0",
]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.mypy]
python_version = 3.12
warn_return_any = true
warn_unused_configs = true
